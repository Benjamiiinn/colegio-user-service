spring.application.name=user-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:user_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.port=9091

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

application.security.jwt.secret-key=${JWT_SECRET:586B633834416E396D7436753879382F423F4428482B4C6250655367566B5970}
application.security.jwt.expiration=900000
application.security.jwt.cookie-name=jwt-cookie

application.security.jwt.refresh-token-expiration=1296000000
application.security.jwt.refresh-token.cookie-name=refresh-jwt-cookie

# Registro en Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${AWS_PRIVATE_IPV4}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
